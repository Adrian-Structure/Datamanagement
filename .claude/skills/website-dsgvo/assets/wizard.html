<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website DSGVO — Pipeline & Review</title>
<style>
  :root{
    --bg:#050a12;--bg2:#081020;--panel:#0a1526;--panel2:#0d1b30;--line:#12263f;
    --cyan:#22d3ee;--cyan-dim:#0e7490;--orange:#f59e0b;--orange2:#fb923c;
    --text:#e6f1fa;--muted:#8aa3ba;--ok:#34d399;--r:14px;font-size:15px;
    /* Alias-Bruecke: Bestands-JS nutzt diese Variablen in Inline-Styles */
    --tinte:#e6f1fa;--papier:#050a12;--gold:#f59e0b;--linie:#12263f;--gruen:#34d399;--rot:#f87171
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans SC","Noto Sans JP",sans-serif;
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(34,211,238,.07), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(245,158,11,.05), transparent 60%),
      var(--bg);
    color:var(--text);
    display:grid;grid-template-columns:230px 1fr;min-height:100vh;line-height:1.55;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ---------- Sidebar ---------- */
  aside{background:linear-gradient(180deg,#060c16,#04080f);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:22px 14px;gap:6px}
  .logo{padding:0 10px 18px;display:flex;gap:10px;align-items:center}
  .logo img{width:44px;height:44px;border-radius:10px;flex:none}
  .logo b{font-size:1.25rem;letter-spacing:.14em;display:block}
  .logo span{color:var(--cyan);font-size:.58rem;letter-spacing:.2em;font-weight:600;display:block}
  nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
    color:var(--muted);border:1px solid transparent;transition:.15s;text-align:left;width:100%}
  .nav-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
  .nav-item:hover{color:var(--text);background:rgba(34,211,238,.05)}
  .nav-item.active{color:var(--cyan);background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.35);
    box-shadow:0 0 18px rgba(34,211,238,.12), inset 0 0 12px rgba(34,211,238,.05)}
  .side-badge{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    display:flex;gap:10px;align-items:center;background:rgba(34,211,238,.03)}
  .side-badge svg{width:20px;height:20px;stroke:var(--cyan);fill:none;stroke-width:1.7;flex:none}
  .side-badge b{color:var(--cyan);font-size:.85rem;display:block}
  .side-badge small{color:var(--muted);font-size:.72rem}

  /* ---------- Main ---------- */
  main{display:flex;flex-direction:column;min-width:0}
  header{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:16px 28px 0}
  .sprachen{display:flex;gap:6px}
  .sprachen button{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;transition:.15s}
  .sprachen button:hover{color:var(--text)}
  .sprachen button.an{color:var(--cyan);border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08)}
  .content{padding:10px 28px 26px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%;margin:0 auto}

  /* ---------- Hero ---------- */
  .hero{display:grid;grid-template-columns:1fr 340px 300px;gap:18px;align-items:center}
  .hero-text h2{color:var(--cyan);font-weight:500;font-size:1.25rem;margin-bottom:2px}
  .hero-text h1{font-size:2.7rem;line-height:1.05;letter-spacing:-.01em;margin-bottom:12px}
  .hero-text h1 .accent{color:var(--cyan)}
  .hero-text p{color:var(--muted);font-size:1.02rem;max-width:34ch;margin-bottom:20px}
  .hero-tags{display:flex;gap:22px;flex-wrap:wrap}
  .tag{display:flex;gap:8px;align-items:center;color:var(--text);font-size:.9rem}
  .tag svg{width:18px;height:18px;stroke:var(--cyan);fill:none;stroke-width:1.7}
  .tag + .tag{border-left:1px solid var(--line);padding-left:22px}
  .bot-stage{display:grid;place-items:center;position:relative;min-height:280px}
  .bot-stage img{width:100%;max-width:280px;border-radius:24px;
    border:1px solid rgba(34,211,238,.35);
    filter:drop-shadow(0 14px 30px rgba(34,211,238,.22));
    box-shadow:0 0 44px rgba(34,211,238,.14)}
  .status{border:1px solid var(--line);border-radius:var(--r);
    background:linear-gradient(180deg,var(--panel2),var(--panel));padding:18px;align-self:start;margin-top:14px}
  .status h3{font-size:.98rem;font-weight:600;margin-bottom:14px}
  .status-row{display:flex;gap:14px;align-items:center}
  .ring{position:relative;width:76px;height:76px;flex:none}
  .ring svg{width:76px;height:76px;transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--cyan);font-size:1.02rem}
  .status-row b{display:block;font-size:.95rem;margin-bottom:3px}
  .status-row small{color:var(--muted);font-size:.78rem;line-height:1.45;display:block}

  /* ---------- Action-Karten ---------- */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{border-radius:var(--r);padding:26px;position:relative;display:flex;flex-direction:column;gap:14px;
    background:linear-gradient(180deg,var(--panel2),var(--panel))}
  .card.cyan{border:1px solid rgba(34,211,238,.4);box-shadow:0 0 34px rgba(34,211,238,.07)}
  .card.orange{border:1px solid rgba(245,158,11,.5);box-shadow:0 0 34px rgba(245,158,11,.08)}
  .card-head{display:flex;gap:18px;align-items:flex-start}
  .card-icon{width:88px;height:88px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid;position:relative}
  .card.cyan .card-icon{border-color:rgba(34,211,238,.5);box-shadow:0 0 22px rgba(34,211,238,.25), inset 0 0 18px rgba(34,211,238,.08)}
  .card.orange .card-icon{border-color:rgba(245,158,11,.6);box-shadow:0 0 22px rgba(245,158,11,.28), inset 0 0 18px rgba(245,158,11,.09)}
  .card-icon svg{width:44px;height:44px;fill:none;stroke-width:1.6}
  .card.cyan .card-icon svg{stroke:var(--cyan)}
  .card.orange .card-icon svg{stroke:var(--orange2)}
  .card h3{font-size:1.35rem;line-height:1.2}
  .card p{color:var(--muted);font-size:.95rem;line-height:1.5;max-width:38ch}
  .cta{display:flex;justify-content:center;align-items:center;gap:10px;border-radius:12px;padding:14px;
    font-weight:700;font-size:1.02rem;transition:.15s;width:100%}
  .cta .arr{transition:transform .15s}
  .cta:hover .arr{transform:translateX(4px)}
  .cta.cyan{background:linear-gradient(90deg,#0891b2,var(--cyan));color:#03222b}
  .cta.cyan:hover{box-shadow:0 6px 24px rgba(34,211,238,.35)}
  .cta.orange{background:linear-gradient(90deg,#d97706,var(--orange2));color:#2a1602}
  .cta.orange:hover{box-shadow:0 6px 24px rgba(245,158,11,.35)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:var(--muted);font-size:.8rem;transition:.15s}
  .chip:hover{color:var(--cyan);border-color:rgba(34,211,238,.4)}
  .steps{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .step{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    border:1px solid rgba(245,158,11,.55);color:var(--orange2);font-size:.75rem;font-weight:700}
  .steps small{color:var(--muted);margin-left:8px;font-size:.82rem}

  /* ---------- Feature-Leiste + Warnung ---------- */
  .features{border:1px solid var(--line);border-radius:var(--r);background:rgba(10,21,38,.6);
    display:grid;grid-template-columns:repeat(4,1fr)}
  .feature{padding:20px 22px;display:flex;gap:14px;align-items:flex-start}
  .feature + .feature{border-left:1px solid var(--line)}
  .feature svg{width:34px;height:34px;stroke:var(--cyan);fill:none;stroke-width:1.5;flex:none;margin-top:2px}
  .feature b{color:var(--cyan);font-size:.92rem;display:block;margin-bottom:5px}
  .feature small{color:var(--muted);font-size:.78rem;line-height:1.5;display:block}
  .cockpit-warn{border:1px solid rgba(248,113,113,.3);border-left:3px solid var(--rot);border-radius:10px;
    padding:14px 18px;background:rgba(248,113,113,.05);font-size:.85rem;color:var(--muted)}
  .cockpit-warn b{color:#fca5a5}

  /* ---------- Views ---------- */
  .view{display:none}
  .view.active{display:flex;flex-direction:column;gap:20px}
  .infobox{border:1px solid var(--line);border-radius:var(--r);
    background:linear-gradient(180deg,var(--panel2),var(--panel));padding:28px;display:flex;flex-direction:column;gap:12px}
  .infobox b{font-size:1.2rem}
  .infobox p{color:var(--muted);max-width:75ch;line-height:1.6}

  /* ---------- Wizard-Maschine (dunkel) ---------- */
  #wizardBlock{display:none;max-width:860px;margin:0 auto;width:100%}
  #badge{margin:0 0 4px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;display:none}
  #badge b{background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.35);padding:4px 10px;border-radius:6px}
  #badge a{margin-left:12px;color:var(--muted);cursor:pointer;text-decoration:underline}
  #balken{height:4px;background:var(--line);border-radius:2px;margin:14px 0 22px;overflow:hidden;display:none}
  #balken div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));transition:width .3s}
  .schritt{display:none;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:var(--r);padding:26px 28px}
  .schritt.aktiv{display:block}
  .schritt h2{font-size:20px;margin-bottom:4px}
  .schritt h2 span{color:var(--cyan);font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.15em;margin-right:8px}
  .schritt .warum{font-size:13.5px;color:var(--muted);margin-bottom:16px}
  fieldset{border:0;margin:12px 0}
  label.opt{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;
    cursor:pointer;font-size:15.5px;background:rgba(8,16,32,.6);transition:.15s}
  label.opt:hover{border-color:rgba(34,211,238,.45)}
  label.opt input{margin-right:10px;accent-color:var(--cyan)}
  input[type=checkbox]{accent-color:var(--cyan)}
  input[type=text],input[type=email],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    font:inherit;font-size:15px;background:rgba(5,10,18,.7);color:var(--text);margin-bottom:8px}
  input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{outline:none;border-color:rgba(34,211,238,.55)}
  input[type=file]{font:inherit;font-size:13.5px;margin:4px 0 10px;color:var(--muted)}
  .feldname{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:block;margin:10px 0 4px}
  .zeile{display:flex;gap:24px;margin-top:26px;align-items:center}
  button.nav{font:inherit;font-size:15px;padding:10px 22px;border-radius:10px;border:1px solid rgba(34,211,238,.5);
    background:linear-gradient(90deg,#0891b2,var(--cyan));color:#03222b;font-weight:700;cursor:pointer}
  button.nav.zurück{background:transparent;color:var(--muted);border-color:var(--line);font-weight:400}
  button.nav:hover{opacity:.9}
  #navzeile{display:none}
  #pruefenGo{background:linear-gradient(90deg,#0891b2,var(--cyan))!important;color:#03222b!important;border:none!important;font-weight:700}
  #bauenC{background:linear-gradient(90deg,#059669,var(--ok))!important;color:#02180f!important;border:none!important;font-weight:700}
  textarea.zettel{width:100%;height:340px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:14px;
    border:1px solid var(--line);border-radius:10px;background:#071019;color:#cfe6f5}
  .ampel{margin:14px 0;font-size:14.5px}
  .ampel li{list-style:none;padding:4px 0}
  .ok::before{content:"✅ "} .auf::before{content:"⚠️ "}
  .hinweis{margin-top:14px;padding:10px 14px;border-left:3px solid var(--orange);background:rgba(245,158,11,.07);font-size:13.5px;border-radius:0 8px 8px 0}
  .scanbox{margin:10px 0;padding:12px 14px;border:1px dashed rgba(34,211,238,.4);border-radius:10px;background:rgba(34,211,238,.04);font-size:13.5px;display:none}
  .scanbox b{color:var(--cyan)}
  .scanbox ul{margin:6px 0 6px 20px}
  #kopiertC,#kopiertR{color:var(--ok);display:none}
  footer{margin-top:14px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.1em;color:var(--muted)}

  @media (max-width:1100px){
    .hero{grid-template-columns:1fr 1fr}
    .bot-stage{display:none}
    .actions{grid-template-columns:1fr}
    .features{grid-template-columns:1fr 1fr}
    .feature:nth-child(3){border-left:none;border-top:1px solid var(--line)}
    .feature:nth-child(4){border-top:1px solid var(--line)}
  }
  @media (max-width:760px){
    body{grid-template-columns:1fr}
    aside{flex-direction:row;align-items:center;overflow-x:auto;padding:12px}
    .logo{padding:0 10px}
    nav{flex-direction:row}
    .nav-item span{display:none}
    .side-badge{display:none}
    .hero{grid-template-columns:1fr}
    .features{grid-template-columns:1fr}
    .feature + .feature{border-left:none;border-top:1px solid var(--line)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body>

<aside>
  <div class="logo"><img id="logo" alt="Website DSGVO"><div><b>DSGVO</b><span data-i="ck_brand"></span></div></div>
  <nav id="nav">
    <button class="nav-item active" data-view="cockpit">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span data-i="nav_cockpit"></span>
    </button>
    <button class="nav-item" data-view="pruefungen">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <span data-i="nav_pruef"></span>
    </button>
    <button class="nav-item" data-view="projekte">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      <span data-i="nav_proj"></span>
    </button>
    <button class="nav-item" data-view="berichte">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg>
      <span data-i="nav_ber"></span>
    </button>
    <button class="nav-item" data-view="vorlagen">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h6M9 15h4"/></svg>
      <span data-i="nav_vorl"></span>
    </button>
    <button class="nav-item" data-view="wissensbasis">
      <svg viewBox="0 0 24 24"><path d="M12 5c-2-1.5-5-1.5-8 0v13c3-1.5 6-1.5 8 0 2-1.5 5-1.5 8 0V5c-3-1.5-6-1.5-8 0z"/><path d="M12 5v13"/></svg>
      <span data-i="nav_wiss"></span>
    </button>
    <button class="nav-item" data-view="einstellungen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.07-.4.1-.8.1-1.2z"/></svg>
      <span data-i="nav_einst"></span>
    </button>
  </nav>
  <div class="side-badge">
    <svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
    <div><b data-i="ck_priv_b"></b><small data-i="ck_priv_s"></small></div>
  </div>
</aside>

<main>
  <header>
    <div class="sprachen" id="sprachen">
      <button data-lang="de">DE</button><button data-lang="en">EN</button>
      <button data-lang="zh">中文</button><button data-lang="ja">日本語</button>
    </div>
  </header>

  <div class="content">

    <!-- ============ COCKPIT ============ -->
    <section class="view active" id="view-cockpit">
      <div class="hero">
        <div class="hero-text">
          <h2 data-i="ck_willkommen"></h2>
          <h1 data-ih="ck_titel"></h1>
          <p data-i="ck_sub"></p>
          <div class="hero-tags">
            <div class="tag"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span data-i="ck_tag1"></span></div>
            <div class="tag"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5L19 19M19 5l-2.5 2.5M7.5 16.5L5 19"/></svg><span data-i="ck_tag2"></span></div>
            <div class="tag"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg><span data-i="ck_tag3"></span></div>
          </div>
        </div>

        <div class="bot-stage">
          <img id="logoHero" alt="Website DSGVO — Logo">
        </div>

        <div class="status">
          <h3 data-i="ck_st_h"></h3>
          <div class="status-row">
            <div class="ring">
              <svg viewBox="0 0 76 76">
                <circle cx="38" cy="38" r="32" fill="none" stroke="#12263f" stroke-width="6"/>
                <circle cx="38" cy="38" r="32" fill="none" stroke="#22d3ee" stroke-width="6"
                        stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="0"/>
              </svg>
              <div class="val">100%</div>
            </div>
            <div>
              <b data-i="ck_st_b"></b>
              <small data-ih="ck_st_s"></small>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <div class="card cyan">
          <div class="card-head">
            <div class="card-icon">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/><path d="M7.5 11a3.5 3.5 0 007 0" opacity=".7"/></svg>
            </div>
            <div>
              <h3 data-i="ck_c1_h"></h3>
              <p data-i="ck_c1_p"></p>
            </div>
          </div>
          <button class="cta cyan" data-go="pruefungen"><span data-i="ck_c1_cta"></span> <span class="arr">→</span></button>
          <div class="chips">
            <button class="chip" data-go="pruefungen" data-i="ck_chip1"></button>
            <button class="chip" data-go="pruefungen" data-i="ck_chip2"></button>
            <button class="chip" data-go="pruefungen" data-i="ck_chip3"></button>
            <button class="chip" data-go="pruefungen" data-i="ck_chip4"></button>
          </div>
        </div>

        <div class="card orange">
          <div class="card-head">
            <div class="card-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 8h14"/><path d="M6 12h3M6 14h2"/><path d="M17 12l2 .8v2.4c0 1.8-1.2 2.9-2 3.3-.8-.4-2-1.5-2-3.3v-2.4z" transform="translate(1.5 1)"/></svg>
            </div>
            <div>
              <h3 data-i="ck_c2_h"></h3>
              <p data-i="ck_c2_p"></p>
            </div>
          </div>
          <button class="cta orange" data-go="projekte"><span data-i="ck_c2_cta"></span> <span class="arr">→</span></button>
          <div class="steps">
            <span class="step">1</span><span class="step">2</span><span class="step">3</span><span class="step">4</span>
            <span class="step">5</span><span class="step">6</span><span class="step">7</span><span class="step">8</span>
            <small data-i="ck_steps"></small>
          </div>
        </div>
      </div>

const cont=document.getElementById("stufen");
function baueSektionen(spec,prefix){
  spec.forEach((sp,i)=>{
    const sec=document.createElement("section");
    sec.className="schritt"; sec.dataset.flow=prefix; sec.dataset.idx=i;
    sec.innerHTML=`<h2><span class="stufennr"></span><b data-i="${sp.t}"></b></h2>
      <p class="warum" data-i="${sp.w}"></p>${sp.html}`;
    cont.appendChild(sec);
  });
}

let lang=(navigator.language||'de').slice(0,2); if(!L[lang]) lang='en';
if((navigator.language||'').startsWith('de')) lang='de';
let modus=null, s=0;
function T(){return L[lang];}
function FLOW(){return modus? SECS[modus] : [];}
/* ================= Sprache anwenden ================= */
function anwenden(){
  document.documentElement.lang=lang;
  document.title=T().titel.replace(/<[^>]+>/g,'');
  document.getElementById("logo").src = lang==="de" ? LOGO_DE : LOGO_EN;
  {const lh=document.getElementById("logoHero"); if(lh) lh.src = lang==="de" ? LOGO_DE : LOGO_EN;}
  document.getElementById("fuss").textContent=T().fuss;
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T()[el.dataset.i]; if(v!==undefined) el.textContent=v;});
  document.querySelectorAll("[data-ih]").forEach(el=>{const v=T()[el.dataset.ih]; if(v!==undefined) el.innerHTML=v;});
  document.querySelectorAll("s-i").forEach(el=>{const v=T()[el.getAttribute("k")]; if(v!==undefined) el.textContent=v;});
  document.querySelectorAll("[data-ph]").forEach(el=>{const v=T()[el.dataset.ph]; if(v!==undefined) el.placeholder=v;});
  document.querySelectorAll(".schritt").forEach(sec=>{
    const n=+sec.dataset.idx+1, m=sec.dataset.flow==='c'?CREATE.length:REVIEW.length;
    sec.querySelector(".stufennr").textContent =
      lang==='zh' ? `第${n}步/共${m}步` : lang==='ja' ? `ステージ${n}/${m}` : `${T().step} ${n}/${m}`;
  });
  document.getElementById("kopierenC").textContent=T().kopieren;
  {const bb=document.getElementById("bauenC"); if(bb) bb.textContent=T().bauen;}
  {const pg=document.getElementById("pruefenGo"); if(pg) pg.textContent=T().pruefen_go;}
  document.getElementById("kopiertC").textContent=T().kopiert;
  document.getElementById("btnZurück").textContent=T().zurück;
  document.getElementById("wechseln").textContent=T().wechseln;
  document.querySelector("#badge b").textContent = modus==='c'?T().badge_c: modus==='r'?T().badge_r:'';
  document.querySelectorAll(".sprachen button").forEach(b=>b.classList.toggle("an",b.dataset.lang===lang));
  if(modus){ document.getElementById("btnWeiter").textContent = s===FLOW().length-1 ? T().fertig : T().weiter;
    if(s===FLOW().length-1 && modus==='c') baueZettelC(); }
  if(window.SCAN) zeigeScan();
  if(document.getElementById('srcErkannt')) zeigeErkannt();
}
document.querySelectorAll(".sprachen button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;anwenden();});

function starte(m){
  modus=m; s=0;
  document.getElementById("badge").style.display="block";
  document.getElementById("balken").style.display="block";
  document.getElementById("navzeile").style.display="flex";
  zeige(0); anwenden();

function zeigeView(v){
  const wiz=(v==='pruefungen'||v==='projekte');
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active', !wiz && x.id==='view-'+v));
  document.getElementById('wizardBlock').style.display = wiz?'block':'none';
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  window.scrollTo({top:0,behavior:'smooth'});
  if(wiz) starte(v==='pruefungen'?'r':'c'); else anwenden();
  if(v==='einstellungen') apikeyStatusLaden();
}

function zeige(n){
  const F=FLOW(); s=Math.max(0,Math.min(F.length-1,n));
  document.querySelectorAll(".schritt").forEach(el=>el.classList.remove("aktiv"));
  F[s].classList.add("aktiv");
  document.querySelector("#balken div").style.width=((s+1)/F.length*100)+"%";
  document.getElementById("btnZurück").style.visibility=s===0?"hidden":"visible";
  document.getElementById("btnWeiter").textContent = s===F.length-1 ? T().fertig : T().weiter;
  if(s===F.length-1 && modus==='c') baueZettelC();
}
document.getElementById("btnWeiter").onclick=()=>{ if(s===FLOW().length-1){window.scrollTo({top:0,behavior:"smooth"});return;} zeige(s+1); };

function quelleTyp(q){
  if(/github\.com/i.test(q)) return 'repo';
  if(/^https?:\/\//i.test(q) || /^www\./i.test(q) || (/^[a-z0-9-]+(\.[a-z0-9-]+)+([\/:?#]|$)/i.test(q) && q.charAt(0)!=='/')) return 'live';
  return 'pfad';
}

function scanMerge(files){
  const dritt=new Set(), store=new Set(); let forms=0, felder=0, ext=0;
  files.forEach(f=>{ const S=quickScan(f.html);
    S.dritt.forEach(d=>dritt.add(d)); S.store.forEach(x=>store.add(x));
    forms+=S.forms; felder+=S.felder; ext+=S.ext; });
  return {dritt:[...dritt], forms:forms, felder:felder, store:[...store], ext:ext};
}
async function zipHtmlEntries(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder();
  let eocd=-1;
  for(let i=buf.byteLength-22; i>=Math.max(0,buf.byteLength-22-65557); i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error('Kein gültiges ZIP-Archiv.');
  const count=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true);
  const roh=[];
  for(let n=0; n<count && off+46<=buf.byteLength; n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true),
      nlen=dv.getUint16(off+28,true), elen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true),
      lho=dv.getUint32(off+42,true),
      name=td.decode(u8.subarray(off+46,off+46+nlen));
    if(/\.html?$/i.test(name) && name.indexOf('__MACOSX')!==0){
      const dstart=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
      roh.push({name:name, method:method, cdata:u8.slice(dstart,dstart+csize)});
    }
    off+=46+nlen+elen+clen;
  }
  const res=[];
  for(const e of roh){
    let data=null;
    if(e.method===0) data=e.cdata;
    else if(e.method===8 && typeof DecompressionStream==='function'){
      try{ data=new Uint8Array(await new Response(new Blob([e.cdata]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
      catch(_){ data=null; }
    }
    if(data) res.push({name:e.name, html:td.decode(data)});
  }
  return res;
}
async function ladeDatei(file){
  const t=T(), out=document.getElementById('reportOut');
  document.getElementById('f_quelle').value='';
  document.getElementById('claudeHand').innerHTML=''; out.innerHTML='';
  try{
    if(/\.zip$/i.test(file.name)){
      const entries=await zipHtmlEntries(await file.arrayBuffer());
      if(!entries.length){
        window.SCANFILES=null; window.SCAN=null;
        document.getElementById('scanBox').style.display='none';
        out.innerHTML='<div class="hinweis">'+t.p_zipleer+'</div>'; zeigeErkannt(); return;
      }
      window.SCANFILES=entries;
    } else {
      window.SCANFILES=[{name:file.name, html:await file.text()}];
    }
    window.SCAN=scanMerge(window.SCANFILES);
    window.SCAN.datei=window.SCANFILES.map(f=>f.name).join(', ');
    zeigeErkannt(); zeigeScan();
  }catch(err){ out.innerHTML='<div class="hinweis">'+esc(String(err&&err.message?err.message:err))+'</div>'; }
}

function quickScan(html){
  const P={ 'Google Fonts':/fonts\.googleapis\.com|fonts\.gstatic\.com/i,
    'Google Analytics / Tag Manager':/googletagmanager\.com|google-analytics\.com|gtag\(/i,
    'Matomo':/matomo/i, 'YouTube':/youtube\.com\/embed|youtube-nocookie\.com/i, 'Vimeo':/player\.vimeo\.com/i,
    'Google Maps':/maps\.google|google\.com\/maps/i, 'Facebook/Meta':/facebook\.net|facebook\.com\/plugins|connect\.facebook/i,
    'X/Twitter':/platform\.twitter|platform\.x\.com/i, 'Instagram':/instagram\.com\/embed/i, 'LinkedIn':/linkedin\.com\/embed/i,
    'TikTok':/tiktok\.com\/embed/i, 'CDN (jsdelivr/cdnjs/unpkg)':/cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|unpkg\.com/i,
    'Adobe Fonts/Typekit':/typekit\.net/i, 'FontAwesome CDN':/use\.fontawesome\.com/i, 'Hotjar':/hotjar/i, 'DoubleClick Ads':/doubleclick\.net/i };
  const dritt=Object.keys(P).filter(k=>P[k].test(html));
  const forms=(html.match(/<form[\s>]/gi)||[]).length;
  const felder=(html.match(/<input[^>]+type=["'](email|tel|text)["']/gi)||[]).length;
  const store=[/document\.cookie/i.test(html)&&'document.cookie',/localStorage/i.test(html)&&'localStorage',/sessionStorage/i.test(html)&&'sessionStorage'].filter(Boolean);
  const ext=(html.match(/<(script|link)[^>]+(src|href)=["']https?:\/\//gi)||[]).length;
  return {dritt,forms,felder,store,ext};
}
function zeigeScan(){
  const S=window.SCAN,t=T();

  if(S.ext) teile.push(`<li>${t.scan_ext}: ${S.ext}</li>`);
  document.getElementById("scanErg").innerHTML = teile.length?`<ul>${teile.join('')}</ul>`:`<div>${t.scan_keine}</div>`;
}

function crc32(buf){let crc=~0;for(let i=0;i<buf.length;i++){crc^=buf[i];for(let j=0;j<8;j++)crc=(crc>>>1)^(0xEDB88320&-(crc&1));}return (~crc)>>>0;}

function makeZip(files){
  const enc=new TextEncoder(); const local=[],central=[]; let offset=0;
  files.forEach(f=>{
    const nameB=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const lhA=Uint8Array.from([].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0)));
    local.push(lhA,nameB,data);
    central.push(Uint8Array.from([].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset))),nameB);
    offset+=lhA.length+nameB.length+data.length;
  });
  const cdStart=offset; let cdSize=0; central.forEach(a=>cdSize+=a.length);
  const eocd=Uint8Array.from([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(cdStart),u16(0)));
  const parts=local.concat(central,[eocd]); let total=0; parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total); let pos=0; parts.forEach(p=>{out.set(p,pos);pos+=p.length;});
  return new Blob([out],{type:'application/zip'});
}

function scanToBefund(files){

    summary:'Automatische clientseitige Inspektion ('+files.length+' Datei(en)). Erkannt: '+(drittListe.join(', ')||'keine Drittdienste')+(forms?('; '+forms+' Formular(e)'):'')+'. Gesamtrisiko (heuristisch): '+risk+'. Für die Gesamt-Site zusätzlich die Live-Netzwerkanalyse ergänzen.',
    components:comps, findings:findings,
    missing:['Server-seitiges (echte Cookies, HTTP-Header, TLS-Version, Server-Logs) — nur an der Live-Seite prüfbar.','Ob AV-Verträge (Hoster, Dienste) bestehen.','Betrieb/Sitz, falls kein Impressum in den geprüften Dateien — aus dem Impressum der Live-Site ableiten.'],
    fixes:findings.slice().sort((a,b)=>sev(a.severity).rang-sev(b.severity).rang).map((f,i)=>({prio:'P'+(i+1),text:f.action+' ('+f.title+')'})),
    legalReview:['Endabnahme der DSE-/Impressums-Vollständigkeit durch eine Anwältin/einen Anwalt.','Einzelfallbewertung einwilligungspflichtiger Dienste je nach Konfiguration.']};
}
/* ================= REVIEW: Live-Ausführung über den lokalen Prüfserver ================= */
const DSE_NAMEN={'Google Fonts':/google\s*fonts/i,'Google Analytics / Tag Manager':/google\s*analytics|tag\s*manager/i,'Matomo':/matomo/i,'YouTube':/youtube/i,'Vimeo':/vimeo/i,'Google Maps':/google\s*maps/i,'Facebook/Meta':/facebook|meta platforms/i,'Hotjar':/hotjar/i,'LinkedIn':/linkedin/i,'Instagram':/instagram/i,'TikTok':/tiktok/i,'X/Twitter':/twitter|x\.com/i,'Adobe Fonts/Typekit':/typekit|adobe fonts/i,'DoubleClick Ads':/doubleclick/i};
function liveToBefund(d,quelle){
  const comps=[], findings=[], html=d.html||'', wo=d.finalUrl||quelle;
  /* WÄCHTER: Blockierte/fehlgeschlagene Abrufe erzeugen KEINE Befunde — ehrlich „nicht prüfbar" melden. */
  const geblockt = (d.status!=null && d.status>=400) || (html.length<8000 && /access denied|forbidden|captcha|are you a robot|bot detection|cloudflare|akamai|verifizieren sie/i.test(html));
  if(geblockt){
    return {title:'Website-Compliance-Prüfung — '+wo, target:wo, inspectedAt:heute(),
      sourceType:'Live-URL (Abruf durch die Ziel-Seite blockiert — HTTP '+(d.status!=null?d.status:'?')+')',
      summary:'NICHT PRÜFBAR: Die Ziel-Seite hat den automatischen Abruf blockiert (HTTP '+(d.status!=null?d.status:'?')+', vermutlich Bot-Schutz). Aus einer Blockseite lassen sich KEINE Compliance-Aussagen ableiten — insbesondere keine Aussagen über Impressum, Datenschutzerklärung oder Dienste. Diese Prüfung trifft deshalb bewusst keine Befund-Aussagen.',
      components:[{type:'Server-Antwort',detail:'HTTP-Status '+(d.status!=null?d.status:'—')+' · empfangene Bytes: '+html.length+' (Blockseite)',location:wo}],
      findings:[{severity:'informational',title:'Automatischer Abruf blockiert — keine Prüfung möglich',location:wo,
        evidence:'HTTP '+(d.status!=null?d.status:'?')+', '+html.length+' Bytes Antwort (Bot-Schutz-Signatur).',
        explanation:'Große Websites blockieren Server-Abrufe. Das ist KEIN Compliance-Befund der Seite — die Prüfung braucht einen anderen Weg.',
        norm:'—', action:'Diese URL einem Claude mit dem Skill website-dsgvo geben: er prüft im echten Browser (sieht die gerenderte Seite samt Footer-Links, Netzwerk und Cookies). Alternativ die Seite als HTML speichern und hier hochladen.'}],
      missing:['Alles — die Seite hat den Abruf verweigert. Impressum/Datenschutz/Dienste sind NICHT bewertet.'],
      fixes:[{prio:'P1',text:'Prüfung über den Browser-Weg (Claude-mit-Skill) oder HTML-Upload wiederholen.'}],
      legalReview:[]};
  }
  const S=quickScan(html);
  const hdr=d.headers||{}, hsts=hdr['strict-transport-security'], cookies=d.cookiesGesetzt||[];
  const impDa=!!(d.impText&&d.impText.trim().length>40);
  const dseDa=!!(d.dseText&&d.dseText.trim().length>40);
  if(S.dritt.length) comps.push({type:'Drittdienste',detail:S.dritt.join(', '),location:wo});
  if(S.forms) comps.push({type:'Formulare',detail:S.forms+' Formular(e), '+S.felder+' Eingabefeld(er)',location:wo});
  if(S.store.length) comps.push({type:'Client-Storage',detail:S.store.join(', '),location:wo});
  if(S.ext) comps.push({type:'Externe Ressourcen',detail:S.ext+' extern geladene script/link',location:wo});
  comps.push({type:'Server-Antwort',detail:'HTTP-Status '+(d.status!=null?d.status:'—')+' · HTTPS: '+(d.https?'ja':'NEIN')+' · HSTS: '+(hsts?'ja':'nein')+' · Cookies vor Consent: '+(cookies.length?cookies.join(', '):'keine'),location:wo});
  comps.push({type:'Pflichtseiten',detail:(impDa?'Impressum gefunden ('+(d.impUrl||'—')+')':'KEIN Impressum gefunden')+' · '+(dseDa?'Datenschutzerklärung gefunden ('+(d.dseUrl||'—')+')':'KEINE Datenschutzerklärung gefunden'),location:wo});
  S.dritt.forEach(k=>{const m=SEVMAP[k];if(m)findings.push({severity:m[0],title:m[1],location:wo,evidence:'Muster „'+k+'“ im live abgerufenen HTML gefunden.',explanation:m[2],norm:m[3],action:m[4]});});
  if(!d.https) findings.push({severity:'critical',title:'Website ohne HTTPS ausgeliefert',location:wo,evidence:'Endgültige URL nach Redirects: '+wo,explanation:'Unverschlüsselte Übertragung — schon die IP-Adresse ist ein personenbezogenes Datum; TLS ist Pflicht nach Stand der Technik.',norm:'Art. 32 DSGVO',action:'TLS-Zertifikat einrichten und HTTP→HTTPS-Redirect erzwingen.'});
  if(d.https&&!hsts) findings.push({severity:'low',title:'HSTS-Header fehlt',location:wo,evidence:'Kein strict-transport-security-Header in der Server-Antwort.',explanation:'Ohne HSTS bleibt ein Downgrade auf unverschlüsseltes HTTP möglich.',norm:'Art. 32 DSGVO (Stand der Technik)',action:'Header strict-transport-security setzen (z. B. max-age=31536000; includeSubDomains).'});
  const trk=cookies.filter(n=>/^(_ga|_gid|_gat|_gcl|_fbp|_fbc|_hj|_pk_|_clck|_clsk|_uet|mtm_|amp_|mp_)/i.test(n)||/matomo|piwik/i.test(n));
  const sess=cookies.filter(n=>trk.indexOf(n)<0&&/sess|sid|csrf|xsrf|token/i.test(n));
  const rest=cookies.filter(n=>trk.indexOf(n)<0&&sess.indexOf(n)<0);
  if(trk.length) findings.push({severity:'high',title:'Tracking-Cookies vor Einwilligung gesetzt',location:wo,evidence:'Set-Cookie beim ersten Abruf (ohne Consent): '+trk.join(', '),explanation:'Analyse-/Marketing-Cookies dürfen erst NACH Einwilligung gesetzt werden.',norm:'§ 25 TDDDG · Art. 6 Abs. 1 lit. a DSGVO',action:'Cookies hinter das Consent-Tool legen; Konfiguration prüfen.'});
  if(rest.length) findings.push({severity:'medium',title:'Cookies vor Einwilligung gesetzt — Zweck klären',location:wo,evidence:'Set-Cookie beim ersten Abruf: '+rest.join(', '),explanation:'Ohne Einwilligung sind nur technisch zwingend notwendige Cookies erlaubt.',norm:'§ 25 TDDDG',action:'Zweck jedes Cookies klären; nicht notwendige hinter Consent legen.'});
  if(sess.length) findings.push({severity:'informational',title:'Technische Session-Cookies erkannt',location:wo,evidence:'Set-Cookie beim ersten Abruf: '+sess.join(', '),explanation:'Session-/CSRF-Cookies gelten in der Regel als technisch notwendig — in der Datenschutzerklärung erwähnen.',norm:'§ 25 Abs. 2 TDDDG',action:'Als notwendige Cookies in der Datenschutzerklärung aufführen.'});
  if(typeof d.status==='number'&&d.status>=400) findings.push({severity:'medium',title:'Seite liefert Fehlerstatus '+d.status,location:wo,evidence:'HTTP-Status '+d.status+' beim Abruf.',explanation:'Die Prüfung lief gegen eine Fehlerseite — Befund ggf. unvollständig.',norm:'—',action:'Erreichbarkeit der Seite prüfen, dann erneut prüfen.'});
  if(!impDa){
    const pr=d.proben||{}, prTxt=Object.keys(pr).map(k=>k+' → '+pr[k]).join(' · ');
    findings.push({severity:'critical',title:'Kein Impressum auffindbar',location:wo,evidence:(prTxt?'Proben: '+prTxt:'Kein Impressum-Link und kein Impressums-Text gefunden.'),explanation:'Die Anbieterkennzeichnung ist Pflicht und muss von jeder Seite in max. 2 Klicks erreichbar sein.',norm:'§ 5 DDG',action:'Impressum-Seite anlegen (Gerüst im Skill) und im Footer jeder Seite verlinken.'});
  } else {
    if(!/\b\d{5}\b/.test(d.impText)) findings.push({severity:'high',title:'Impressum ohne erkennbare ladungsfähige Anschrift',location:d.impUrl||wo,evidence:'Kein PLZ-Muster im Impressums-Text erkannt.',explanation:'Verlangt ist eine ladungsfähige Anschrift (kein Postfach).',norm:'§ 5 DDG',action:'Vollständige Anschrift mit PLZ und Ort ergänzen.'});
    if(!/USt|VAT|DE\s?\d{9}/i.test(d.impText)) findings.push({severity:'informational',title:'Keine USt-IdNr. im Impressum erkannt',location:d.impUrl||wo,evidence:'Kein USt-IdNr.-Muster im Impressums-Text.',explanation:'Nur Pflicht, wenn eine USt-IdNr. existiert — sonst unbedenklich (Kleinunternehmer-Fall).',norm:'§ 5 DDG',action:'Falls vorhanden: USt-IdNr. ergänzen.'});
  }
  if(!dseDa){
    findings.push({severity:'critical',title:'Keine Datenschutzerklärung auffindbar',location:wo,evidence:'Kein Datenschutz-Link und kein Datenschutz-Text gefunden.',explanation:'Die Informationspflichten verlangen eine leicht erreichbare Datenschutzerklärung.',norm:'Art. 13 DSGVO',action:'Datenschutzerklärung anlegen (Gerüst im Skill) und im Footer jeder Seite verlinken.'});
  } else {
    if(!/beschwerde|aufsichtsbeh|art\.?\s*77/i.test(d.dseText)) findings.push({severity:'medium',title:'Datenschutzerklärung ohne Hinweis auf das Beschwerderecht',location:d.dseUrl||wo,evidence:'Kein Treffer für „Beschwerde/Aufsichtsbehörde“ im Datenschutz-Text.',explanation:'Der Hinweis auf das Beschwerderecht bei einer Aufsichtsbehörde ist Pflichtangabe.',norm:'Art. 13 Abs. 2 lit. d · Art. 77 DSGVO',action:'Passage zum Beschwerderecht ergänzen.'});
    S.dritt.forEach(k=>{const rx=DSE_NAMEN[k];if(rx&&!rx.test(d.dseText)) findings.push({severity:'medium',title:'Dienst „'+k+'“ nicht in der Datenschutzerklärung erwähnt',location:d.dseUrl||wo,evidence:'Im Live-HTML erkannt, im Datenschutz-Text kein Treffer für '+k+'.',explanation:'Jeder eingesetzte Dienst braucht eine eigene Passage in der Datenschutzerklärung.',norm:'Art. 13 DSGVO',action:'DSE-Modul für '+k+' ergänzen.'});});
  }
  if(S.forms) findings.push({severity:'medium',title:'Formular — Datenminimierung prüfen',location:wo,evidence:S.forms+' Formular(e), '+S.felder+' Eingabefeld(er).',explanation:'Nur notwendige Felder; optionale als freiwillig kennzeichnen; DSE-Kontaktpassage nötig.',norm:'Art. 5 Abs. 1 lit. c · Art. 6 DSGVO',action:'Felder minimieren; DSE-Passage ergänzen.'});
  if(S.store.length) findings.push({severity:'medium',title:'Zugriff auf Endgerät-Speicher',location:wo,evidence:S.store.join(', ')+' im Code.',explanation:'Speichern/Auslesen auf dem Endgerät kann § 25 TDDDG auslösen (außer technisch notwendig).',norm:'§ 25 TDDDG',action:'Zweck prüfen; ggf. Consent.'});
  const risk=findings.some(f=>f.severity==='critical')?'hoch':findings.some(f=>f.severity==='high')?'erhöht':findings.length?'niedrig-mittel':'niedrig';
  const missing=['Ob AV-Verträge (Hoster, Dienste) bestehen — organisatorisch, nicht technisch messbar.','Consent-Verhalten nach Klick (nur der Erstabruf ohne Einwilligung wurde gemessen).','Unterseiten jenseits der Startseite und der Pflichtseiten.'];
  if(d.fehler) missing.unshift('Teilfehler beim Abruf: '+d.fehler);
  return {title:'Website-Compliance-Prüfung — '+wo, target:wo, inspectedAt:heute(),
    sourceType:'Live-URL (lokal ausgeführt durch den Cockpit-Prüfserver)',
    summary:'Echte Live-Prüfung durch das Cockpit: Seite abgerufen, Header/Cookies/Pflichtseiten gemessen. Erkannt: '+(S.dritt.join(', ')||'keine Drittdienste')+(S.forms?('; '+S.forms+' Formular(e)'):'')+'; Cookies vor Consent: '+(cookies.length||'keine')+'. Gesamtrisiko (heuristisch): '+risk+'.',
    components:comps, findings:findings, missing:missing,
    fixes:findings.slice().sort((a,b)=>sev(a.severity).rang-sev(b.severity).rang).map((f,i)=>({prio:'P'+(i+1),text:f.action+' ('+f.title+')'})),
    legalReview:['Endabnahme der DSE-/Impressums-Vollständigkeit durch eine Anwältin/einen Anwalt.','Einzelfallbewertung einwilligungspflichtiger Dienste je nach Konfiguration.']};
}
function pause(ms){return new Promise(r=>setTimeout(r,ms));}
function zeigeBericht(befund,st,out){
  const t=T();
  const url=URL.createObjectURL(new Blob([rptRender(befund)],{type:'text/html'}));
  st.textContent=t.p_fertig+' '+befund.findings.length+' '+t.p_funde;
  out.innerHTML='<div style="margin:8px 0"><a class="nav" style="display:inline-block;text-decoration:none;background:#123a6b;color:#eef4fa;padding:9px 16px;border-radius:8px" download="report.html" href="'+url+'">'+t.p_dl+'</a></div><iframe title="report" style="width:100%;height:520px;border:1px solid var(--linie);border-radius:8px;background:#fff" src="'+url+'"></iframe>';
}
async function pruefeAusfuehren(){
  const t=T(), st=document.getElementById('pruefStatus'),
    out=document.getElementById('reportOut'), hand=document.getElementById('claudeHand');
  out.innerHTML=''; hand.innerHTML='';
  if(window.SCANFILES && window.SCANFILES.length){
    st.textContent=t.p_analyse;
    zeigeBericht(scanToBefund(window.SCANFILES),st,out);
    return;
  }
  const q=g('f_quelle');
  if(!q){ st.textContent=''; out.innerHTML='<div class="hinweis">'+t.p_keinequelle+'</div>'; return; }
  const typ=quelleTyp(q);
  if(window.SERVER){
    try{
      st.textContent=t.p_inspect;
      const resp=await fetch('/api/pruefe?url='+encodeURIComponent(q));
      let d=null; try{ d=await resp.json(); }catch(_){ d=null; }
      if(!d) throw new Error('HTTP '+resp.status);
      if(!d.html && d.fehler) throw new Error(d.fehler);
      if(!d.html && !resp.ok) throw new Error('HTTP '+resp.status);
      st.textContent=t.p_analyse; await pause(450);
      st.textContent=t.p_check; await pause(450);
      st.textContent=t.p_report; await pause(300);
      const befund=liveToBefund(d,q);
      const kiMsg=await kiAudit(befund,d,t,st);
      zeigeBericht(befund,st,out);
      if(kiMsg) out.insertAdjacentHTML('afterbegin','<div class="hinweis" style="margin:6px 0">'+esc(kiMsg)+'</div>');
    }catch(err){
      st.textContent='';
      out.innerHTML='<div class="hinweis">'+t.p_servfehler+' '+esc(String(err&&err.message?err.message:err))+'</div>';
    }
    return;
  }
  window.CLAUDE_AUFTRAG=[
    'modus: review',
    'typ: '+(typ==='repo'?'github-repo':typ==='live'?'live-url':'lokaler-pfad'),
    'quelle: '+q,
    'auftrag: Diese Quelle vollständig selbst inspizieren (Seiten, Netzwerk-Requests, Cookies, Header, Fonts, Analytics, Formulare, Drittdienste; Impressum und Datenschutzerklärung selbst lesen). KEINE Rückfragen zu technisch Feststellbarem. Statusmeldungen: Inspecting… → Analysing… → Checking compliance… → Generating report… → Done. Ergebnis: report.html nach references/pruefbericht.md (7 Abschnitte, Severities, Belege).'
  ].join('\n');
  st.textContent='';
  hand.innerHTML='<div class="hinweis" style="margin-bottom:8px">'+(typ==='repo'?t.det_repo:typ==='live'?t.det_live:t.det_pfad)+' — '+t.r_claude+'</div>'
    +'<button class="nav" id="handGo" style="background:#1f9d55;color:#eafff2">'+t.r_hand+'</button> <span id="handOk" style="display:none;color:var(--gruen)"></span>';
}
/* ================= KI-Audit (optional, über den lokalen Prüfserver) ================= */
async function kiAudit(befund,d,t,st){
  let da=false;
  try{ const r=await fetch('/api/key'); const j=await r.json(); da=!!(j&&j.vorhanden); }catch(_){ return ''; }
  if(!da) return '';
  st.textContent=t.ki_laeuft;
  try{
    const komp=(befund.components||[]).map(c=>c.type+': '+(c.detail||'')).join('\n');
    const funde=(befund.findings||[]).map(f=>'['+(f.severity||'')+'] '+(f.title||'')).join('\n');
    const dse=String((d&&d.dseText)||'').replace(/\s+/g,' ').slice(0,1500);
    const prompt=('Als DSGVO-Prüfer: bestätige oder korrigiere die Severities der folgenden Befunde und nenne übersehene Punkte. Antworte in 5-10 Sätzen Deutsch, sachlich, ohne Aufzählungszeichen.\n\n'
      +'Titel: '+(befund.title||'')+'\nZiel: '+(befund.target||'')
      +'\n\nKomponenten:\n'+(komp||'—')
      +'\n\nBefunde (Titel + Severity):\n'+(funde||'keine')
      +'\n\nAuszug Datenschutzerklärung:\n'+(dse||'—')).slice(0,5000);
    const resp=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,maxTokens:700})});
    const j=await resp.json().catch(()=>null);
    if(j&&j.ok&&j.text){ befund.kiAudit=String(j.text).trim(); return ''; }
    if(j&&j.fehler==='key_ungueltig') return t.ki_key_ungueltig;
    if(j&&j.fehler==='kein_guthaben_oder_limit') return t.ki_kein_guthaben;
    return '';
  }catch(_){ return ''; }
}
/* ================= Einstellungen: API-Key-Verwaltung (Key nie anzeigen, nie im Browser speichern) ================= */
function serverMoeglich(){return location.protocol==='http:'||location.protocol==='https:';}
async function apikeyStatusLaden(){
  const st=document.getElementById('apikeyStatus'); if(!st) return;
  const t=T();
  if(!serverMoeglich()){ st.textContent=t.ek_kein_server; return; }
  try{
    const r=await fetch('/api/key'); const j=await r.json();
    st.textContent=(j&&j.vorhanden)?t.ek_da:t.ek_fehlt;
  }catch(_){ st.textContent=t.ek_kein_server; }
}
async function apikeySpeichern(){
  const inp=document.getElementById('f_apikey'), st=document.getElementById('apikeyStatus'), t=T();
  if(!st) return;
  const key=inp?inp.value.trim():'';
  if(!key){ st.textContent=t.ek_leer; return; }
  if(!serverMoeglich()){ st.textContent=t.ek_kein_server; return; }
  try{
    const r=await fetch('/api/key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})});
    const j=await r.json().catch(()=>null);
    if(r.ok&&!(j&&j.ok===false)){ if(inp) inp.value=''; st.textContent=t.ek_da; }
    else st.textContent=t.ek_fehler;
  }catch(_){ st.textContent=t.ek_fehler; }
}
document.addEventListener("click",e=>{
  if(e.target&&e.target.id==="pruefenGo"){ pruefeAusfuehren(); }
  if(e.target&&e.target.closest&&e.target.closest('#apikeySpeichern')){ apikeySpeichern(); }
  if(e.target&&e.target.id==="handGo"){
    const tx=window.CLAUDE_AUFTRAG||'';
    (navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject())
      .catch(()=>{ const ta=document.createElement('textarea'); ta.value=tx;
        ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); })
      .finally(()=>{ const ok=document.getElementById('handOk'); if(ok){ ok.textContent=T().r_hand_ok; ok.style.display='inline'; } });
  }
});
/* Server-Erkennung: läuft das Cockpit über den lokalen Prüfserver? */
window.SERVER=false;
if(location.protocol==='http:'||location.protocol==='https:'){
  (function(){ const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),800);
    fetch('/api/ping',{signal:ac.signal}).then(r=>r.json()).then(j=>{ if(j&&j.ok){ window.SERVER=true; } })
    .catch(()=>{}).finally(()=>clearTimeout(to));
  })();
}
anwenden();
